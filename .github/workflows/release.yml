name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm Trusted Publishing: GitHub issues a short-lived OIDC token that npm
      # exchanges for a one-time publish credential, so no npm token can expire.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted Publishing needs npm CLI >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Verify npm Trusted Publisher access
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const identityUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          identityUrl.searchParams.set('audience', 'npm:registry.npmjs.org')
          const identityResponse = await fetch(identityUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          })
          if (!identityResponse.ok) throw new Error(`GitHub OIDC request failed: ${identityResponse.status}`)
          const { value: identity } = await identityResponse.json()
          if (!identity) throw new Error('GitHub did not return an OIDC identity')
          let denied = false
          for (const name of ['@waldjs/cli', '@waldjs/compiler', '@waldjs/content', 'create-wald']) {
            const response = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(name)}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${identity}`, 'Content-Type': 'application/json' },
              body: '{}',
            })
            if (response.ok) {
              console.log(`${name}: Trusted Publisher access granted`)
            } else {
              denied = true
              const result = await response.json().catch(() => ({}))
              // Never print successful response bodies: they contain publish tokens.
              console.error(`${name}: token exchange denied (${response.status}); ${result.message ?? result.error ?? 'check npm Trusted Publisher settings'}`)
            }
          }
          if (denied) throw new Error('npm Trusted Publisher authorization failed before publishing')
          NODE

      # Publish using the workflow OIDC identity. An explicit registry token
      # can select token authentication instead of Trusted Publishing.
      - name: Create Version PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
