name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm Trusted Publishing: GitHub issues a short-lived OIDC token that npm
      # exchanges for a one-time publish credential, so no npm token can expire.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm CLI >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Create Version PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback only: npm uses Trusted Publishing (OIDC) first for every
          # package that has it configured on npmjs.com. Remove this line once
          # all packages are set up.
          NODE_AUTH_TOKEN: ${{ secrets.WALDJS_KEY_3 }}
