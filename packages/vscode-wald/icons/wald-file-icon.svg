<!--
  Standalone version of marketing/src/assets/favicon.svg's tree mark, for use
  as a VS Code file icon (contributes.languages[].icon in package.json).
  Two changes from the favicon: the "W"/"JS" wordmark text is dropped (it
  relies on Puffin Display Soft, a Typekit font tied to the marketing site's
  own domain that isn't available to VS Code's offline SVG renderer — the
  same reason the scaffold starter's own brand mark avoids it, see
  docs/superpowers/specs/2026-07-26-scaffold-starter-redesign-design.md),
  and the tree's opacity goes from .3 (a subtle backdrop behind bold text)
  to 1 (the full, sole focal mark) so it stays visible at 16px icon sizes.
-->
